<!-- T-06 "Thẻ ảnh hàng lỗi mới nhất" — widget tùy chỉnh ThingsBoard (loại: Latest values).
     Data keys cần khai báo trong widget: defect_image (bắt buộc), ai_label, ai_conf, pkg_id, reason (tùy chọn).
     Ảnh là JPEG 320x240 base64 (<= 40 KB) trong key defect_image; thời gian lấy từ ts của điểm dữ liệu. -->
<div class="sorter-defect-card">
  <div class="sorter-defect-header">
    <span class="sorter-defect-title">Hàng lỗi mới nhất</span>
    <span class="sorter-defect-time" id="dc-time">—</span>
  </div>
  <div class="sorter-defect-body">
    <div class="sorter-defect-imgwrap">
      <img id="dc-img" alt="Ảnh kiện hàng lỗi" />
      <div class="sorter-defect-empty" id="dc-empty">Chưa có ảnh lỗi</div>
    </div>
    <div class="sorter-defect-meta">
      <div><span class="k">Kiện</span><span class="v" id="dc-pkg">—</span></div>
      <div><span class="k">Nhãn AI</span><span class="v" id="dc-label">—</span></div>
      <div><span class="k">Loại lỗi</span><span class="v" id="dc-defect">—</span></div>
      <div><span class="k">Độ tin cậy</span><span class="v" id="dc-conf">—</span></div>
      <div><span class="k">Lý do</span><span class="v" id="dc-reason">—</span></div>
    </div>
  </div>
</div>
